name: Approved controller runtime (manual only)

# This workflow is deliberately not attached to push or pull_request events.
# Its source must be dispatched from main so PR-controlled YAML/commands cannot
# run on the dedicated self-hosted runner before trusted review/merge.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lwg-approved-controller-runtime
  cancel-in-progress: false

jobs:
  approved-controller-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.RUN_APPROVED_CONTROLLER_INTEGRATION == 'true' && vars.APPROVED_CONTROLLER_RUNTIME_APPROVED == 'true' }}
    runs-on: [self-hosted, linux, x64, lwg-approved-controller-test]
    timeout-minutes: 30
    env:
      WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR: benchmarks/results/approved-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare unique runtime evidence directory
        run: |
          set -eu
          test ! -e "$WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR"
          test ! -L "$WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR"
          mkdir -m 700 "$WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR"
      - name: Verify approved runner prerequisites
        id: preflight
        run: |
          set -eu
          out="$WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR/prerequisite-preflight.txt"
          {
            printf 'recorded_at=%s\n' "$(date --iso-8601=seconds)"
            printf 'host=%s\n' "$(hostname)"
            printf 'kernel=%s\n' "$(uname -srmo)"
            grep -E '^(ID|VERSION_ID|PRETTY_NAME)=' /etc/os-release || true
            printf 'cgroup_fs=%s\n' "$(stat -fc %T /sys/fs/cgroup 2>/dev/null || echo unavailable)"
            printf 'cgroup_controllers=%s\n' "$(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null | tr '\n' ' ' || echo unavailable)"
            printf 'user_systemd_manager='; if systemctl --user show-environment >/dev/null 2>&1; then echo available; else echo unavailable; fi
          } > "$out"
          fail() {
            printf 'preflight_status=FAIL\nfailure_reason=%s\n' "$1" >> "$out"
            echo "Approved runner prerequisite failed: $1" >&2
            exit 1
          }
          grep -qx 'ID=ubuntu' /etc/os-release || fail 'host is not Ubuntu'
          grep -qx 'VERSION_ID="22.04"' /etc/os-release || fail 'G1 requires Ubuntu 22.04'
          [ "$(stat -fc %T /sys/fs/cgroup 2>/dev/null || true)" = cgroup2fs ] || fail 'cgroup v2 is unavailable'
          grep -qw cpu /sys/fs/cgroup/cgroup.controllers || fail 'cgroup v2 CPU controller is unavailable'
          systemctl --user show-environment >/dev/null 2>&1 || fail 'user systemd manager is unavailable'
          printf 'preflight_status=PASS\n' >> "$out"
      - name: Approved isolated delegated CPU controller integration
        id: controller
        env:
          WORKLOAD_GUARD_CONTROLLER_RESULTS_DIR: ${{ env.WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR }}/controller
        run: |
          set -o pipefail
          {
            echo '### Delegated CPU runtime gate'
            echo 'This result is limited to the approved dedicated runner and temporary test slices; it does not close ABBA, throughput, rollback, PSI-crossing, or soak gates.'
          } >> "$GITHUB_STEP_SUMMARY"
          WORKLOAD_GUARD_REQUIRE_LIVE_CONTROLLER=1 ./tests/controller-integration.sh 2>&1 \
            | tee "$WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR/controller-step.log"
      - name: Approved routing lifecycle integration
        id: routing
        run: |
          set -o pipefail
          {
            ./tests/integration-routing.sh &&
              ./tests/recovery-routing.sh &&
              ./tests/shadow-routing.sh &&
              ./tests/aggregate-scope-integration.sh
          } 2>&1 | tee "$WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR/routing-step.log"
      - name: Finalize runtime evidence bundle
        if: ${{ always() }}
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          CONTROLLER_OUTCOME: ${{ steps.controller.outcome }}
          ROUTING_OUTCOME: ${{ steps.routing.outcome }}
        run: |
          set -eu
          out="$WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR"
          test -d "$out" && test ! -L "$out"
          {
            printf 'recorded_at=%s\n' "$(date --iso-8601=seconds)"
            printf 'workflow_run_id=%s\n' '${{ github.run_id }}'
            printf 'workflow_run_attempt=%s\n' '${{ github.run_attempt }}'
            printf 'source_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'ref=%s\n' '${{ github.ref }}'
            printf 'preflight_step_outcome=%s\n' "${PREFLIGHT_OUTCOME:-unknown}"
            printf 'controller_step_outcome=%s\n' "${CONTROLLER_OUTCOME:-unknown}"
            printf 'routing_step_outcome=%s\n' "${ROUTING_OUTCOME:-unknown}"
            printf 'host=%s\n' "$(hostname)"
            printf 'kernel=%s\n' "$(uname -srmo)"
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release || true
            printf 'cgroup_mode=%s\n' "$(stat -fc %T /sys/fs/cgroup 2>/dev/null || echo unavailable)"
            printf 'release_gate_decision=OPEN_PENDING_INDEPENDENT_REVIEW'
          } > "$out/provenance-and-status.txt"
          (
            cd "$out"
            find . -type f ! -name SHA256SUMS.txt ! -name manifest-verification.txt ! -name manifest-digest.txt \
              ! -name .manifest-inputs.tmp ! -name .manifest-sorted.tmp -print0 > .manifest-inputs.tmp
            sort -z .manifest-inputs.tmp > .manifest-sorted.tmp
            xargs -0 -r sha256sum < .manifest-sorted.tmp > SHA256SUMS.txt
            rm -f .manifest-inputs.tmp .manifest-sorted.tmp
            sha256sum -c SHA256SUMS.txt > manifest-verification.txt
            sha256sum SHA256SUMS.txt > manifest-digest.txt
          )
          printf 'Runtime evidence manifest digest (record separately for review):\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$out/manifest-digest.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload runtime evidence (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: approved-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WORKLOAD_GUARD_RUNTIME_EVIDENCE_DIR }}/
          if-no-files-found: warn
          retention-days: 90
