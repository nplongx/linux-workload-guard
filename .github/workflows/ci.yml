name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: ./test.sh
      - name: Soak monitor fail-closed acceptance regression
        run: ./tests/soak-monitor.sh
      - name: Python compile checks
        run: python3 -m py_compile bin/workload-router.py bin/workload-profile benchmarks/*.py tests/controller-hardening.py tests/routing-telemetry.py
      - name: Strict benchmark telemetry parser regressions
        run: python3 tests/routing-telemetry.py
      - name: Stage installed helpers for systemd validation
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m 0755 bin/workload-router.py "$HOME/.local/bin/workload-router.py"
          install -m 0755 bin/limit-browser-automation-cgroup "$HOME/.local/bin/limit-browser-automation-cgroup"
      - name: Validate systemd units
        run: systemd-analyze --no-pager verify systemd/*.service systemd/*.timer systemd/*.slice
      - name: Shell syntax
        run: |
          sh -n install.sh uninstall.sh test.sh bin/run-workload bin/workload-guard bin/limit-browser-automation-cgroup tests/integration-routing.sh tests/recovery-routing.sh tests/shadow-routing.sh tests/install-uninstall.sh tests/controller-integration.sh tests/recovery-unit.sh tests/soak-monitor.sh tests/routing-benchmark-safety.sh tests/quota-benchmark-safety.sh tests/live-psi-observe-safety.sh tests/performance-review.sh benchmarks/soak-monitor.sh
          bash -n benchmarks/quota-benchmark.sh benchmarks/routing-contention-isolated.sh
      - name: Patch whitespace validation
        run: git diff --check
      - name: Install/uninstall smoke test
        run: ./tests/install-uninstall.sh
      - name: Version smoke test
        run: ./bin/workload-guard version
      - name: Integration routing
        run: ./tests/integration-routing.sh
      - name: Recovery routing
        run: ./tests/recovery-routing.sh
      - name: Shadow routing
        run: ./tests/shadow-routing.sh
      - name: Delegated CPU runtime gate (SKIP is not PASS)
        run: ./tests/controller-integration.sh
      - name: Aggregate scope integration
        run: ./tests/aggregate-scope-integration.sh
      - name: Aggregate benchmark evidence integrity regressions
        run: ./tests/analyze-aggregate-routing.sh
